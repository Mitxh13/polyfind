services:
  # ─── MySQL ──────────────────────────────────────────────────────────────────
  # Used for Docker-based full-stack deployments.
  # For local Windows development, use the native MySQL 8.0 service instead
  # (port 3306 is already occupied by MySQL80 Windows service).
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: polyfind
      MYSQL_USER: polyfind
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    volumes:
      - polyfind-mysql:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "polyfind", "-pchange-me"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ─── Redis 8 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - polyfind-redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Neo4j 5 Community ──────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/PolyFindNeo4j2026!}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - polyfind-neo4j-data:/data
      - polyfind-neo4j-logs:/logs
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ─── Qdrant (vector store) ──────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - polyfind-qdrant:/qdrant/storage
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ─── App (production Docker deployment only) ─────────────────────────────────
  # For local development, run: npm run dev
  # This service is for full Docker-stack or production builds only.
  app:
    build: .
    environment:
      NODE_ENV: production
      CATALOG_MODE: live
      DATABASE_URL: mysql://polyfind:${MYSQL_PASSWORD:-change-me}@mysql:3306/polyfind
      REDIS_URL: redis://redis:6379
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-PolyFindNeo4j2026!}
      VECTOR_STORE_PROVIDER: ${VECTOR_STORE_PROVIDER:-}
      VECTOR_STORE_URL: http://qdrant:6333
      APP_URL: ${APP_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      API_PORT: 3001
      PORT: 3000
      AUTH_SECRET: ${AUTH_SECRET:-replace-in-production}
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy

volumes:
  polyfind-mysql:
  polyfind-redis:
  polyfind-neo4j-data:
  polyfind-neo4j-logs:
  polyfind-qdrant:
